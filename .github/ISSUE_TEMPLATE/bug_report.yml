name: Bug report
description: Something in FocusBae does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste private meeting content or transcripts.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a recording with Microphone + system audio
        2. Connect AirPods
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FocusBae version
      description: Settings → About
      placeholder: "1.3.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Air M2, 16 GB"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Recording, Transcription, Speakers, Action items / ledger, Notes, Search, Import / export / backup, Updates, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Anything else
      description: Screenshots or error messages (remove anything private).
